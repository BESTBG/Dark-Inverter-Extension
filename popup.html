<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <h1>Dark Inverter</h1>

    <div class="control-group">
      <span class="label">Page Invert</span>
      <label class="switch">
        <input type="checkbox" id="pageToggle">
        <span class="slider round"></span>
      </label>
    </div>

    <div class="control-group">
      <span class="label">Image Invert</span>
      <label class="switch">
        <input type="checkbox" id="imageToggle">
        <span class="slider round"></span>
      </label>
    </div>

    <p id="status">Ready</p>
  </div>
  <script src="popup.js"></script>
</body>

</html>
